name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python libs
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy heartpy wfdb

      - name: Configure
        run: |
          cmake -S . -B build-mac -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cmake --build build-mac -j

      - name: Run CTest
        run: |
          ctest --test-dir build-mac -V

      - name: Generate synthetic CSV for parity
        run: |
          python - << 'PY'
          import math
          fs=50.0
          secs=30
          bpm=72.0
          f=bpm/60.0
          n=int(fs*secs)
          with open('build-mac/tmp_sig.csv','w') as fo:
              for i in range(n):
                  t=i/fs
                  v=0.7*math.sin(2*math.pi*f*t)+0.2*math.sin(4*math.pi*f*t)+0.1*math.sin(6*math.pi*f*t)+512.0
                  fo.write(f"{v}\n")
          PY

      - name: Python parity vs HeartPy (signal)
        run: |
          python HeartPy-Master-Backup-20250913-204053/examples/validate_vs_heartpy.py --csv build-mac/tmp_sig.csv --fs 50

      - name: Python parity vs HeartPy (RR, limited)
        run: |
          python HeartPy-Master-Backup-20250913-204053/examples/validate_mitbih_rr.py --limit 2

